name: PPU fetch built wheel

description: |
  等 ppu-linux-build 编完「同一个 commit」的 torch whl，下载并落到源码树内，供
  ppu-distributed-action 随源码一起打包送进 PPU pod。

  为什么抽成 composite action：ppu_smoke.yml 与 ppu_accuracy.yml 都要做这件事，
  而「等哪个 run / 怎么判成功 / whl 放哪」这三件事必须两边完全一致 —— 各写一份的话，
  任何一侧漏改都会退化成「测了一份不是本 PR 编出来的 torch」，而日志上看不出异常。

  为什么用轮询而不是 workflow_run 触发：workflow_run 只读默认分支上的 workflow 文件，
  且它的 run 不会作为 PR 的 check 出现，当不了 PR 门禁。

inputs:
  build-workflow:
    description: 编译门禁的 workflow 文件名
    required: false
    default: ppu_linux_build.yml
  head-sha:
    description: 关联键；两条 workflow 的 run 都以 PR head commit 作为 head_sha
    required: true
  wheel-dir:
    description: whl 落地目录（相对源码根，必须在源码树内且不被 .gitignore 命中）
    required: true
  timeout-minutes:
    description: 等编译的上限；冷编译要 4~5h
    required: false
    default: "300"
  poll-seconds:
    description: 轮询间隔
    required: false
    default: "60"
  grace-minutes:
    description: 「一个 build run 都还没出现」的宽限期
    required: false
    default: "15"
  github-token:
    description: 需要 actions:read（查 run 状态 + 跨 run 下载 artifact）
    required: false
    default: ${{ github.token }}

outputs:
  run-id:
    description: 提供 whl 的那个 ppu-linux-build run id
    value: ${{ steps.wait.outputs.run-id }}
  run-url:
    description: 该 run 的页面链接
    value: ${{ steps.wait.outputs.run-url }}
  wheel-name:
    description: 下载到的 whl 文件名
    value: ${{ steps.verify.outputs.wheel-name }}

runs:
  using: composite
  steps:
    # 只调 REST API，不占 PPU 卡；等待发生在编排用的 CPU runner 上
    - name: 等待 ppu-linux-build 编译完成
      id: wait
      uses: actions/github-script@v7
      env:
        BUILD_WORKFLOW: ${{ inputs.build-workflow }}
        HEAD_SHA: ${{ inputs.head-sha }}
        WAIT_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        WAIT_POLL_SECONDS: ${{ inputs.poll-seconds }}
        WAIT_GRACE_MINUTES: ${{ inputs.grace-minutes }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const workflow = process.env.BUILD_WORKFLOW;
          const headSha = process.env.HEAD_SHA;
          const pollMs = Number(process.env.WAIT_POLL_SECONDS) * 1000;
          const timeoutMs = Number(process.env.WAIT_TIMEOUT_MINUTES) * 60 * 1000;
          const graceMs = Number(process.env.WAIT_GRACE_MINUTES) * 60 * 1000;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const startedAt = Date.now();

          core.info(`[wait] 目标: ${workflow} @ head_sha=${headSha}`);
          while (true) {
            const waited = Date.now() - startedAt;
            const waitedMin = Math.round(waited / 60000);
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflow,
              head_sha: headSha,
              per_page: 20,
            });
            const runs = data.workflow_runs;

            // 同一个 sha 上可能既有 pull_request 触发的 run、又有手动触发 / 重跑的，
            // 只要有一次成功就能拿到可用的 whl
            const ok = runs.find((r) => r.status === 'completed' && r.conclusion === 'success');
            if (ok) {
              core.info(`[wait] 编译已成功（等待 ${waitedMin} 分钟）: ${ok.html_url}`);
              core.setOutput('run-id', String(ok.id));
              core.setOutput('run-url', ok.html_url);
              return;
            }

            const pending = runs.find((r) => r.status !== 'completed');
            if (pending) {
              core.info(`[wait] 编译中 (${pending.status})，已等 ${waitedMin} 分钟: ${pending.html_url}`);
            } else if (runs.length > 0) {
              // 全部 completed 且无一成功：再等下去也不会有 whl，直接失败
              core.setFailed(
                `[wait] ${workflow} 未成功（conclusion=${runs[0].conclusion}）: ${runs[0].html_url}\n` +
                '没有可用的 whl。先修好编译，再重跑本 workflow。'
              );
              return;
            } else if (waited > graceMs) {
              core.setFailed(
                `[wait] 等了 ${waitedMin} 分钟仍找不到 ${workflow} 在 ${headSha} 上的 run。\n` +
                '最常见原因：本 workflow 与 ppu_linux_build.yml 的 branches / paths 过滤不一致，' +
                '导致这个 PR 只触发了测试、没触发编译。'
              );
              return;
            } else {
              core.info(`[wait] 还没查到 build run，宽限期内继续等（已等 ${waitedMin} 分钟）`);
            }

            if (waited > timeoutMs) {
              core.setFailed(
                `[wait] 超时：等 ${workflow} 超过 ${process.env.WAIT_TIMEOUT_MINUTES} 分钟。` +
                '冷编译（ccache 未命中）本身就要 4~5h，可先在 base 分支跑一次 ppu_refresh_cache.yml 种缓存。'
              );
              return;
            }
            await sleep(pollMs);
          }

    - name: 下载 whl artifact
      uses: actions/download-artifact@v4
      with:
        # artifact 名形如 ppu-wheel-<env>-<commit>（见 _ppu_build.yml 的 Collect wheel 步骤），
        # 这里按前缀取，不在两边各写一份命名规则
        pattern: ppu-wheel-*
        merge-multiple: true
        path: ${{ inputs.wheel-dir }}
        # 跨 run 下载必须显式给 run-id + token（默认只在当前 run 内找）
        run-id: ${{ steps.wait.outputs.run-id }}
        github-token: ${{ inputs.github-token }}

    - name: 校验 whl 已就位
      id: verify
      shell: bash
      env:
        WHEEL_DIR: ${{ inputs.wheel-dir }}
        BUILD_RUN_URL: ${{ steps.wait.outputs.run-url }}
      run: |
        # 卡在这里，而不是等 pod 起来才发现没包 —— 那时已经占着 PPU 卡了
        shopt -s nullglob
        whls=("${WHEEL_DIR}"/torch-*.whl)
        if [[ ${#whls[@]} -ne 1 ]]; then
          echo "::error::期望 ${WHEEL_DIR} 下恰好 1 个 torch-*.whl，实际 ${#whls[@]} 个"
          ls -la "${WHEEL_DIR}" 2>/dev/null || echo "（目录不存在）"
          exit 1
        fi
        wheel_name=$(basename "${whls[0]}")
        echo "wheel-name=${wheel_name}" >> "$GITHUB_OUTPUT"
        echo "[wheel] ${wheel_name} ($(du -h "${whls[0]}" | cut -f1))"
        {
          echo "### 被测 whl"
          echo ""
          echo "- 包: \`${wheel_name}\`"
          echo "- 来源: ${BUILD_RUN_URL}"
        } >> "$GITHUB_STEP_SUMMARY"
