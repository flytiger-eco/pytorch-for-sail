name: ppu-890-base-api-scheduler

on:
  # schedule:
  #   # 20:00（UTC 12:00）
  #   - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: schedule base api (${{ matrix.branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        branch: [v2.10.0, v2.12.0, v2.13.0]

    steps:
      - name: Trigger target branch workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ matrix.branch }}
        run: |
          gh workflow run ppu-890-base-api-nightly.yml \
            --repo "$GH_REPO" \
            --ref "$TARGET_BRANCH"
