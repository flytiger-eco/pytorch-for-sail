# P0 smoke gate: PPU CUDA 冒烟测试，跑在自建 PPU 集群的单卡 pod 上。
#
# 执行模型（与"直接在 runner 容器里跑测试"的早期版本不同）：
#   - 本 job 只在 CPU runner 上做编排：checkout 源码后，由
#     flytiger-eco/ppu-distributed-action 把源码打包暂存到 NAS，在带 PPU 卡的节点上
#     拉起 pod，解压到 source_dir，再执行 command。
#   - 所以 runner 容器只需小体积的 actions-runner 镜像；PPU 发布镜像只在 PPU pod 内
#     使用，避免 CPU 节点拉大镜像超时（此前 "initialize container" 失败的原因）。
#   - 冒烟用例只需单卡：nnodes: 0 + nproc_per_node: 1。
#
# 与 test-h100.yml 的差异：
#   - 不编译 whl：test-h100 走 _linux-build.yml 先编 wheel 再测；这里跳过 build，
#     直接通过内部 pip 源预装 torch（镜像里已是 PPU 运行环境）。
#   - 只跑 CUDA 相关用例，且裁掉 H100/B200 专属用例。用例清单见
#     .ci/ppu/smoke_test.sh。
name: ppu-smoke

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # PPU 发布镜像：自带 python3.12 + CUDA13 + PPU SDK，在 PPU pod 内使用
  IMAGE: ghcr.io/actions/actions-runner:latest
  NAMESPACE: ppu-sched
  HOST_VOLUMES: "/nas_aisw:/nas_aisw,/wl_nas:/mnt/wl_nas"
  # action 在 pod 内解压源码的路径（也是 action 的默认值，这里显式写出便于 command 引用）
  SOURCE_DIR: /workspace/source
  NODE_SELECTOR: "board-type=OAM-810E"
  PIP_INDEX: https://pkg.flytiger-eco.com/artifactory/api/pypi/pypiindex/simple
  TORCH_VERSION: "2.11.0"

jobs:
  ppu-smoke-810e-single:
    name: ppu-smoke (810E 单卡)
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 90

    steps:
      - name: Checkout PyTorch
        uses: actions/checkout@v4
        with:
          # 签出 PR head commit（github.sha 在 PR 场景是 merge commit），保证测试代码与 PR 一致
          ref: ${{ github.event.pull_request.head.sha }}
          # 只跑 python 测试，不需要 third_party 子模块；浅克隆加速，也减小传到 NAS 的包体积
          fetch-depth: 1

      - name: "810E 单卡 (1 PPU) CUDA 冒烟测试"
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          nnodes: 0
          nproc_per_node: 1
          node_selector: ${{ env.NODE_SELECTOR }}
          host_volumes: ${{ env.HOST_VOLUMES }}
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          source_dir: ${{ env.SOURCE_DIR }}
          timeout_minutes: 60
          # 环境变量必须在 command 里注入：job 级 env 不会传进 PPU pod。
          # 脚本自身会 cd 到源码根目录，所以这里只给绝对路径即可。
          command: |
            PR_NUMBER="${{ github.event.pull_request.number }}" \
            PIP_INDEX="${{ env.PIP_INDEX }}" \
            TORCH_VERSION="${{ env.TORCH_VERSION }}" \
            SDK_INSTALL_DIR="/usr/local" \
            bash ${{ env.SOURCE_DIR }}/.ci/ppu/smoke_test.sh
