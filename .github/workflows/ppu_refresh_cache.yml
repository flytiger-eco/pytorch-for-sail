name: ppu-refresh-cache

on:
  workflow_dispatch:
    inputs:
      target-branch:
        description: Branch to seed the cache for (must match the PR base branch name, otherwise the prefix will not align)
        type: string
        default: v2.11.0
      ccache-maxsize:
        description: ccache size limit (board count × branch count × this value must stay within the 10GiB quota)
        type: string
        default: "4G"
      ignore-ccache:
        description: Ignore existing cache and do a cold build to rebuild a clean baseline
        type: boolean
        default: false
      upload-wheel:
        description: Also upload the whl artifact (the main output of this pipeline is the cache, not uploaded by default)
        type: boolean
        default: false
  push:
    branches:
      - v2.11.0
    paths:
      - '.github/workflows/ppu_refresh_cache.yml'
      - '.github/workflows/_ppu_build.yml'
      - '.ci/ppu/**'

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh ccache (${{ matrix.board }})
    strategy:
      fail-fast: false
      matrix:
        board: ["810", "890"]
    uses: ./.github/workflows/_ppu_build.yml
    with:
      board: ${{ matrix.board }}
      source-ref: ${{ inputs.target-branch || '' }}
      cache-branch: ${{ inputs.target-branch || '' }}
      ccache-maxsize: ${{ inputs.ccache-maxsize || '4G' }}
      ignore-ccache: ${{ inputs.ignore-ccache || false }}
      upload-wheel: ${{ inputs.upload-wheel || false }}
      save-ccache: true
      prune-old-ccache: true
      timeout-minutes: 400
