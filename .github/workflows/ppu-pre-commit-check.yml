name: ppu-pre-commit-check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  precheck:
    name: Pre-check
    uses: flytiger-eco/.github/.github/workflows/user-precheck.yml@main

  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: precheck
    uses: flytiger-eco/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  human-review:
    name: Human Review Gate
    needs: [smoke-test, ai-code-review]
    uses: flytiger-eco/.github/.github/workflows/human-review.yml@main
    secrets: inherit
