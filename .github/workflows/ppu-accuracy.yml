# P1 accuracy gate: PPU Inductor 精度测试（结构参考 inductor.yml，执行机制沿用 ppu_smoke.yml）。
#
# 设计取舍（重要）：
#   - inductor.yml 本身只是一个"薄编排层"：它调用 _linux-build.yml（先编 wheel）+ _linux-test.yml，
#     跑在 pytorch 官方云 GPU runner（linux.g5.4xlarge.nvidia.gpu 等）上，并且带
#     `if: github.repository_owner == 'pytorch'` 守卫。这套结构（先 build 再 test、云端 runner、
#     pytorch-only）与本仓库"跳过 build whl + 自托管 PPU runner + 内部源 pip 预装 torch"的诉求
#     本质互斥，无法照搬其 job/runner 定义。
#   - 因此这里只保留 inductor.yml 的**测试语义与 job 划分**：CUDA inductor + 纯 CPU inductor 两条线
#     （对齐其 inductor-test / inductor-cpu-test 两个 job），**执行机制完全沿用 ppu_smoke.yml**：
#     自托管 ptg-ppu-01、PPU 发布镜像、不编 wheel、pip 预装 torch==2.11.0、
#     测试前 source .ci/ppu/sdk_env.sh。
#   - 测试范围：仅跑 inductor **正确性/精度单测**（python test/run_test.py --include inductor/...），
#     用 include 白名单精确过滤，天然排除掉非目标用例：
#       * 分布式/多卡：inductor/test_distributed_patterns、inductor/test_collective_autotuning
#       * 特殊后端：inductor/test_halide、inductor/test_pallas、inductor/test_triton_cpu_backend、
#         inductor/*_cpp_wrapper
#       * H100/B200(SM90/TMA/CUTLASS) 专属：inductor/test_max_autotune、inductor/test_cutedsl_grouped_mm、
#         inductor/test_cutlass_backend、inductor/test_flex_attention 的 TMA 用例
#         （真武 PPU 不适用，与 ppu_smoke.yml 的裁剪保持一致）
#   - 设备覆盖：CUDA job 让 PPU 设备可见，跑 CUDA 相关 inductor 用例；
#     CPU job 用 CUDA_VISIBLE_DEVICES="" 屏蔽设备，强制 inductor 走纯 CPU 代码路径。
#   - 触发方式：与 ppu_smoke.yml 一致用 pull_request + workflow_dispatch（作为 PR 门禁）。
#     不沿用 inductor.yml 的 push-to-main + repository_owner=='pytorch' 守卫（那是官方仓库专用）。
#     注意：pull_request 事件读取的是**默认分支**上的 workflow 文件，本文件需先合入默认分支才会对新 PR 生效。
name: ppu-accuracy

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

permissions:
  contents: read

# 容器内 sh 未必等价 bash，显式指定，避免 run 步骤被 sh -e 执行导致 bash 语法失败
defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # CUDA/PPU 侧 inductor 精度单测（对齐 inductor.yml 的 inductor-test job）
  # ---------------------------------------------------------------------------
  ppu-accuracy-cuda:
    name: ppu-accuracy-cuda
    runs-on: ptg-ppu-01
    # PPU 发布镜像：自带 python3.12 + CUDA13 + PPU SDK，才能执行 pip install 与 CUDA 用例。
    # 注意：容器需能访问 PPU 设备，若默认拿不到设备，请在此追加 options（如 --device /dev/xxx
    # 或 --gpus all），或由 k8s runner 的 pod 模板挂载对应 device plugin 资源。
    container:
      image: pkg.flytiger-eco.com/docker_release/ppu:v2.1.1-cuda13.0-ubuntu24-py312
    timeout-minutes: 120
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # 内部 pip 源（安装 torch 用）
      PIP_INDEX: https://pkg.flytiger-eco.com/artifactory/api/pypi/pypiindex/simple
      # PPU SDK 安装目录，供 .ci/ppu/sdk_env.sh 使用
      SDK_INSTALL_DIR: /usr/local

    steps:
      - name: Checkout PyTorch
        uses: actions/checkout@v4
        with:
          # 签出 PR head commit（github.sha 在 PR 场景是 merge commit），保证测试代码与 PR 一致
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # 只跑 python 测试，不需要 third_party 子模块；浅克隆加速
          fetch-depth: 1

      - name: Install torch from internal index
        run: |
          # 跳过 build whl：直接装内部源预编译好的 torch
          # 等价于：pip install torch==2.11.0 -i https://pkg.flytiger-eco.com/artifactory/api/pypi/pypiindex/simple
          python -m pip install torch==2.11.0 -i "${PIP_INDEX}"

      - name: Run CUDA inductor accuracy tests
        run: |
          # sdk_env.sh 会 source PPU SDK 的 envsetup.sh（设置 LD_LIBRARY_PATH / PATH）并校验 nvcc。
          # 这些环境变量只在当前 shell 生效，所以必须与测试放在同一个 run 步骤里 source。
          source .ci/ppu/sdk_env.sh

          echo "=== 环境自检 (CUDA) ==="
          echo "event=${GITHUB_EVENT_NAME} pr=${PR_NUMBER:-none} sha=${GITHUB_SHA} runner=${RUNNER_NAME}"
          python --version
          python -c "import torch; print('torch', torch.__version__); print('cuda_available', torch.cuda.is_available()); print('device_count', torch.cuda.device_count())"
          ppu-smi || echo "[warn] ppu-smi 不可用，请确认容器已挂载 PPU 设备"

          echo "=== CUDA inductor 精度单测（run_test.py --include 白名单过滤，仅 CUDA 相关） ==="
          # 下面的 include 白名单是"可调项"：先给一组有代表性的 CUDA 精度用例，
          # 请按 PPU 实际支持情况增删（例如想加深 op 级覆盖可加 inductor/test_torchinductor_opinfo，
          # 但该文件很重、耗时长，默认不放进门禁）。
          # 不使用 --upload-artifacts-while-running：那是官方 S3 上传路径，自托管 runner 上没有。
          python test/run_test.py \
            --include \
              inductor/test_torchinductor \
              inductor/test_torchinductor_dynamic_shapes \
              inductor/test_cuda_repro \
              inductor/test_cudagraph_trees \
              inductor/test_gpu_select_algorithm \
              inductor/test_fp8 \
            --verbose

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-accuracy-cuda-reports-${{ github.event.pull_request.number || github.sha }}
          path: test/test-reports/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  # ---------------------------------------------------------------------------
  # 纯 CPU 侧 inductor 精度单测（对齐 inductor.yml 的 inductor-cpu-test job）
  # ---------------------------------------------------------------------------
  ppu-accuracy-cpu:
    name: ppu-accuracy-cpu
    runs-on: ptg-ppu-01
    container:
      image: pkg.flytiger-eco.com/docker_release/ppu:v2.1.1-cuda13.0-ubuntu24-py312
    timeout-minutes: 90
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PIP_INDEX: https://pkg.flytiger-eco.com/artifactory/api/pypi/pypiindex/simple
      SDK_INSTALL_DIR: /usr/local

    steps:
      - name: Checkout PyTorch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Install torch from internal index
        run: |
          # 跳过 build whl：直接装内部源预编译好的 torch
          python -m pip install torch==2.11.0 -i "${PIP_INDEX}"

      - name: Run CPU inductor accuracy tests
        run: |
          # 仍需 source sdk_env.sh：PPU 版 torch 依赖 SDK 的 LD_LIBRARY_PATH 才能 import 成功。
          source .ci/ppu/sdk_env.sh

          # 纯 CPU：屏蔽 CUDA/PPU 设备，强制 inductor 走 CPU 代码路径（CUDA 用例会自动 skip）。
          # 若 PPU SDK 用的是别的设备可见性变量（而非 CUDA_VISIBLE_DEVICES），请在此一并置空。
          export CUDA_VISIBLE_DEVICES=""

          echo "=== 环境自检 (CPU-only) ==="
          echo "event=${GITHUB_EVENT_NAME} pr=${PR_NUMBER:-none} sha=${GITHUB_SHA} runner=${RUNNER_NAME}"
          python --version
          python -c "import torch; print('torch', torch.__version__); print('cuda_available(expect False)', torch.cuda.is_available())"

          echo "=== 纯 CPU inductor 精度单测（run_test.py --include 白名单过滤，仅 CPU 相关） ==="
          # 同样是"可调项"：一组代表性的 CPU 精度/代码生成用例，按 PPU CPU 后端支持情况增删。
          python test/run_test.py \
            --include \
              inductor/test_cpu_repro \
              inductor/test_cpu_select_algorithm \
              inductor/test_loop_ordering \
              inductor/test_mix_order_reduction \
              inductor/test_inductor_freezing \
              inductor/test_mkldnn_pattern_matcher \
            --verbose

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-accuracy-cpu-reports-${{ github.event.pull_request.number || github.sha }}
          path: test/test-reports/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
