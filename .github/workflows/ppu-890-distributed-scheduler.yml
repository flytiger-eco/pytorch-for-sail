name: ppu-890-distributed-scheduler

on:
  schedule:
    # 02:00
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: schedule distributed (${{ matrix.branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        branch: [v2.10.0, v2.12.0, v2.13.0]

    steps:
      - name: Trigger target branch workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ matrix.branch }}
        run: |
          gh workflow run ppu-890-distributed-nightly.yml \
            --repo "$GH_REPO" \
            --ref "$TARGET_BRANCH"
