# P1 full UT gate: PPU CUDA 全量单元测试，跑在自建 PPU 集群的单卡 pod 上（多分片并行）。
#
# 执行模型（与 ppu_smoke.yml / ppu_accuracy.yml / ppu_perf.yml 一致）：
#   - job 只在 CPU runner 上做编排：checkout 源码后，由
#     flytiger-eco/ppu-distributed-action 把源码打包暂存到 NAS，在带 PPU 卡的节点上
#     拉起 pod，解压到 source_dir，再执行 command。
#   - 所以 runner 容器只需小体积的 actions-runner 镜像；PPU 发布镜像只在 PPU pod 内
#     使用，避免 CPU 节点拉大镜像超时。
#   - runs-on 沿用 ppu_smoke.yml 的 runner 标签，未做任何改动。
#   - 每个分片一个单卡 pod：nnodes: 0 + nproc_per_node: 1。
#   - 8 个分片是 8 个**独立 job**（不是一个 matrix job），原因见下面 ut-default-1 上方的
#     长注释 —— action 的 NAS 暂存路径与 pod 名都只按 github.job 区分。
#   - pod 内实际逻辑见 .ci/ppu/full_ut_test.sh（含仅 CUDA 的两层过滤与 FP8 排除）。
#
# 被测的 torch 从哪来：
#   - 等 ppu_linux_build.yml 在**同一个 commit** 上编出的 whl → 下载它的 artifact →
#     随源码送进 pod → 在 pod 内 pip install 成功后才跑用例。
#   - 「等」是轮询 ppu-linux-build 在同一个 head sha 上的 run（这里取 github.sha，
#     即手动触发时所选 ref 的 tip），而不是用 workflow_run——后者只读默认分支上的
#     workflow 文件，改本文件的分支上没法自测。
#   - 因此跑本 workflow 前，所选 ref 上必须已经有一次成功的 ppu-linux-build：
#       * 该 ref 是某个 PR 的源分支时，PR 自动触发的 build 就以分支 tip 作为 head_sha，
#         直接命中，无需额外操作；
#       * 否则先在同一 ref 上手动跑一次 ppu_linux_build.yml（它也有 workflow_dispatch）。
#         两者先后顺序可以颠倒：先点本 workflow 也行，它会等到 build 出结论为止。
#     所选 ref 上一次 build 都没有时，会在 WAIT_GRACE_MINUTES 后以明确报错失败。
#
# -----------------------------------------------------------------------------
# 测试范围：以 periodic.yml + slow.yml 的 case 为模板
# -----------------------------------------------------------------------------
# 那两条官方流水线本身只是薄编排层（_linux-build.yml 先编 wheel，_linux-test.yml 再测，
# 跑在 pytorch 官方云 GPU runner 上，并带 `github.repository_owner == 'pytorch'` 守卫），
# 这套结构与本仓库「复用 ppu_linux_build.yml 已编好的 whl + 自建 PPU 集群单卡 pod」的
# 诉求本质互斥，无法照搬其 job / runner 定义。这里复制的是它们的 **test-matrix 语义**：
#   - periodic.yml 的 linux-jammy-cuda13.0-py3.10-gcc11 里 config: "default"，5 分片
#   - slow.yml     的 linux-jammy-cuda12.8-py3.10-gcc11-sm86 里 config: "slow"，3 分片
# 分片数刻意与它们保持一致（5 + 3 = 8 个单卡 pod），便于与官方 CI 的结果逐分片对照。
# 两个 config 落到脚本上就是 .ci/pytorch/test.sh 的同一个 test_python_shard，slow 只多
# export PYTORCH_TEST_WITH_SLOW=1 / PYTORCH_TEST_SKIP_FAST=1——推导写在
# .ci/ppu/full_ut_test.sh 头注释里。
#
# periodic.yml 里其余 config 不做，理由：
#   - distributed(3 分片) / multigpu(2 分片)：要多卡，本 pod 单卡；
#   - nogpu_AVX512(3 分片) / nogpu_NO_AVX2(2 分片)：纯 CPU 线，与「仅 CUDA」直接冲突；
#   - jit_legacy(1 分片)：legacy jit executor，恰好是 test_python_shard 用
#     --exclude-jit-executor 排掉的那批；
#   - debug-build(7 分片) / slow-gradcheck(8 分片)：需要 debug / slow-gradcheck 两种特殊
#     编译产物，而本 workflow 复用的是 ppu_linux_build.yml 的常规 release whl，没有这两份包。
#
# 只跑 CUDA 相关用例 + 过滤 FP8：全部在 .ci/ppu/full_ut_test.sh 里落地，两层过滤——
#   - 用例级 PYTORCH_TESTING_DEVICE_ONLY_FOR=cuda（官方 CUDA CI 的同一个开关，设备无关的
#     大文件只实例化 cuda 变体，不在 PPU 卡上白跑 CPU 变体）
#   - 文件级 --exclude 清单（整文件与 CUDA 无关的，如 torch_np/ / test_mkldnn / xpu/）
#   FP8 同样两层：整文件剔掉 test_scaled_matmul_cuda 与 inductor/test_fp8，再挂
#   -k 排除表达式兜住散落在别处的 FP8 用例（真武 PPU 当前不支持 FP8）。
#
# 触发方式：仅手动（workflow_dispatch）。
#   全量 UT 是 8 个单卡 pod × 数小时的量级，不适合挂在每个 PR 上自动跑；需要它的时候
#   在 Actions 页面选一个 ref 手动跑即可。因此本文件不再需要与 ppu_linux_build.yml 对齐
#   branches / paths（那套约束是为了保证「测试自动触发时编译也一定触发」）。
#   另外三条门禁（smoke / accuracy / perf）仍是 pull_request 自动门禁，不受本改动影响。
#   注意：workflow_dispatch 要求本文件已存在于**默认分支**，Actions 页面才会出现
#   「Run workflow」按钮与 ref 下拉框。
name: ppu-full-ut

on:
  # 手动触发：在 Actions 页面选 ref（分支或标签）。github.sha 即该 ref 的 tip，
  # 下面 wait-build 关联 build run、各分片 checkout 源码全部以它为准。
  workflow_dispatch:

concurrency:
  # 手动触发没有 PR 号，改成按 ref 分组：同一 ref 上再点一次「Run workflow」视为
  # 「重跑这个 ref」，取消上一轮（沿用原来 PR 场景「新 push 顶掉旧 run」的语义）；
  # 不同 ref 之间互不干扰。不用 cancel-in-progress: false：那会让第二次手动触发排队
  # 干等前一轮的八个小时。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # 轮询 ppu-linux-build 的 run 状态、以及跨 run 下载它的 whl artifact 都需要
  actions: read

env:
  # PPU 基础镜像：python3.12 + CUDA13 + PPU SDK + triton，不含 torch —— torch 由
  # ppu-linux-build 的 whl 提供。刻意与 _ppu_build.yml 的 docker-image 默认值用同一个 tag：
  # 编译与运行同镜像，才不会出现 whl 与镜像里 SDK / 工具链对不上的问题。
  # 前置要求：该镜像须已预拉到 NODE_SELECTOR 指定板型的节点上，否则 pod 会卡在拉取阶段直至超时。
  IMAGE: pkg.flytiger-eco.com/docker_release/ppu:v2.1.1-cuda13.0-ubuntu24-py312
  NAMESPACE: ppu-sched
  HOST_VOLUMES: "/nas_aisw:/nas_aisw,/wl_nas:/mnt/wl_nas"
  # action 在 pod 内解压源码的路径（也是 action 的默认值，这里显式写出便于 command 引用）
  SOURCE_DIR: /workspace/source
  # 板型选 890P：集群里 890P 有 16 台（每台 8 PPU），810E 只有 1 台（16 PPU）。
  # 本 workflow 一次要起 8 个单卡 pod，钉在 810E 会把一条 PR 的全量 UT 全压到同一台机器上，
  # 和 ppu-smoke / ppu-accuracy / ppu-perf 互相排队。
  NODE_SELECTOR: "board-type=ZW-M890P"
  # 内部 pip 源：pod 内只能访问内网，补装 run_test.py 必需的 pytest 插件要走这个源。
  # 仓库名是 pypi_index（带下划线的 VIRTUAL 仓，聚合 pypi_formal/aliyun/huawei/tsinghua 等代理）。
  # 写成 pypiindex 会命中不存在的仓库，Artifactory 对所有包返回 404，pip 报
  # "Could not find a version that satisfies the requirement ... (from versions: none)"。
  PIP_INDEX: https://pkg.flytiger-eco.com/artifactory/api/pypi/pypi_index/simple
  # inductor 的 codegen 后端 triton：钉版本，且只从上面那个内部仓装（镜像自带的版本不保证
  # 与本 PR 的 torch 匹配）。安装由 .ci/ppu/install_triton.sh 完成，不做多源回退、也不退回
  # 镜像默认源，所以改这个版本号前请先确认它在 PIP_INDEX 那个仓上确实存在；否则 8 个
  # 分片会全部在装 triton 这一步失败（每个分片是独立 pod，各自装一次）。
  # 四条测试门禁（smoke 除外）共用同一个版本号，改一侧就要同步改另几侧。
  TRITON_VERSION: "3.6.0"
  # 依赖的编译门禁：按 workflow 文件名找它在同一个 head sha 上的 run
  BUILD_WORKFLOW: ppu_linux_build.yml
  # whl 落地目录（相对源码根）。必须在源码树内，且不能被 .gitignore 命中：
  # 它要靠 ppu-distributed-action 打包源码一起送进 pod，而 dist/ 在 .gitignore 里，
  # 按 gitignore 过滤的打包方式会把它整个丢掉。
  WHEEL_DIR_REL: .ci/ppu/wheelhouse
  # 等 build 的上限。这是**兜底**而不是正常退出路径：正常情况下等待由 build run 自己的结论
  # 终止 —— 编译成功就往下走；编译失败、或它自己撞上 job 超时（GitHub 记成
  # conclusion=failure），都会立刻命中「未成功」分支快速失败。
  # 所以这个值必须严格大于 build 自己的 job 上限，否则会出现「build 还在正常编、全量 UT 先
  # 判超时」的假失败：whl 最终编出来了，却没有任何门禁测它，只能手动重跑。
  # 取值 = 350 + 40：
  #   - 350 是 build 的硬上限（ppu_linux_build.yml 不传 timeout-minutes，取 _ppu_build.yml
  #     的默认值 350，覆盖冷编译 4~5h 的情况）。改那个默认值必须同步改这里。
  #   - 40 是排队余量：build 的 350 分钟从它真正开始执行才计时，而等待步骤的秒表从 run 创建
  #     就开始跑，等 x86-ubuntu2404-8-32 空闲的 queued 时间只算在本侧。
  WAIT_TIMEOUT_MINUTES: "390"
  # 轮询间隔取 120s（另外三条门禁是 60s）：GITHUB_TOKEN 的 REST 配额是每仓库每小时 1000 次，
  # 而本 workflow 手动跑起来时，同一仓库里往往还有若干 PR 在跑 smoke / accuracy / perf
  # 三条门禁、每条都可能轮询数小时。
  # 本 workflow 把轮询收敛到独立的 wait-build 这一个 job（8 个测试分片靠 needs 复用它的
  # 输出，不各自轮询），再配合 120s 间隔，把本侧的请求量压到 ~30 次/小时。
  WAIT_POLL_SECONDS: "120"
  # 「一个 build run 都还没出现」的宽限期。手动触发的常态是 build 已经跑完，首轮查询
  # 就能命中；这个宽限期留给「先点 full-ut、再去点 build」的情况（给人几分钟去点那一下）。
  # 超过它还查不到，基本就是所选 ref 上压根没编过包，早失败早暴露。
  WAIT_GRACE_MINUTES: "15"
  # 轮询期间容忍的「连续」查询失败次数。自建 runner 出网走代理，调 api.github.com 偶发
  # `RequestError: fetch failed`（octokit 把网络层错误一律记成 status 500）。轮询要持续
  # 几小时、几百次请求，一次抖动就让整个 job 白等是不可接受的，所以只在连续失败到这个
  # 次数（× WAIT_POLL_SECONDS ≈ 20 分钟持续不通）才判定为真故障。查询成功即清零。
  WAIT_MAX_API_FAILURES: "10"

jobs:
  # ---------------------------------------------------------------------------
  # 只做一件事：等本 PR 的 whl 编好，把 build 的 run-id 交给下面的测试分片。
  #
  # 为什么单独拆一个 job（这是与 ppu_smoke.yml 的唯一结构差异）：
  #   - 本 workflow 有 8 个测试分片。若把「等待」内联进每个分片（像另外三条门禁那样），
  #     就是 8 份秒表同时轮询 api.github.com 数小时，白烧 GITHUB_TOKEN 的每小时配额；
  #   - 而且那 8 个 job 会在整个编译期间一直占着 k8s-runner-group-cpu-flytiger 的 runner
  #     槽位干等，把同期其它 workflow 挤在 queued。
  #   - 拆开后编译期只占 1 个槽位，whl 就绪才由 needs 放行 8 个分片。
  #   下载 whl 没法这样共享：ppu-distributed-action 打包的是**各 job 自己 workspace 里的
  #   源码树**，whl 必须落在每个分片的 workspace 内，所以下载仍然是每个分片各做一次。
  # ---------------------------------------------------------------------------
  wait-build:
    name: 等待 ppu-linux-build
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    # 略大于 WAIT_TIMEOUT_MINUTES(390)：否则秒表还没到点、job 先被砍，日志里只剩一条没有
    # 任何原因说明的 job 超时。
    # 注：6 小时 job 上限只约束 GitHub 托管 runner，本 job 在自建 ARC runner 上不受该限制。
    timeout-minutes: 400
    outputs:
      run-id: ${{ steps.wait-build.outputs.run-id }}
      run-url: ${{ steps.wait-build.outputs.run-url }}

    steps:
      # 本 job 不需要 checkout：github-script 只调 REST API，不读源码。
      #
      # 下面这段 script 与 ppu_smoke.yml / ppu_accuracy.yml / ppu_perf.yml 的「等待
      # ppu-linux-build 编译完成」步骤同源，改逻辑必须同步改另三处
      # （diff 这四个文件即可确认没漂移）。只允许两处不同，都是「手动触发 vs PR
      # 门禁」带来的：
      #   - HEAD_SHA：那三条取 PR head sha，本 workflow 取 github.sha；
      #   - 「找不到 build run」那条报错文案：那三条的成因是两侧 paths 过滤不一致，
      #     本 workflow 的成因是所选 ref 上没编过包。
      #
      # 为什么不抽成 composite action：本 job 跑在 ARC(Actions Runner Controller) 自建
      # runner 上且带 container，ARC 的 k8s hook 把 workspace 拷进 job 容器，runner 进程
      # 自己看不到 checkout 的结果 —— `uses: ./.github/actions/xxx` 必然报
      # "Can't find 'action.yml' ... Did you forget to run actions/checkout"，即便
      # checkout 成功。改写成 owner/repo/.github/actions/xxx@ref 也不行：uses 不支持
      # 表达式，ref 只能写死，而改 action 的 PR 就没法自测自己那一版。
      - name: 等待 ppu-linux-build 编译完成
        id: wait-build
        # 只调 REST API，不占 PPU 卡；pod 要到真正跑用例那一步才拉起
        uses: actions/github-script@v7
        env:
          # workflow_dispatch 下 github.sha 就是所选 ref 的 tip（没有 PR 那种 merge commit），
          # 而 ppu-linux-build 的 run 无论由 pull_request 还是 workflow_dispatch 创建，head_sha
          # 都是被编的那个 commit，所以用它做关联键（也与下面测试分片 checkout 的 ref 一致）。
          # 仍然经 env 传而不在 script 里读 context.payload：ARC + container 下 github-script
          # 读不到 GITHUB_EVENT_PATH 指向的 event.json，payload 会静默变成 {}。
          # （context.repo 不受影响：它读的是 GITHUB_REPOSITORY 环境变量。）
          HEAD_SHA: ${{ github.sha }}
        with:
          # 单次请求内部也重试（octokit retry 插件），先扛掉最短的网络抖动；
          # 连续多轮都失败才由下面的 apiFailures 计数判定为真故障。
          retries: 3
          script: |
            const workflow = process.env.BUILD_WORKFLOW;
            const headSha = process.env.HEAD_SHA;
            const pollMs = Number(process.env.WAIT_POLL_SECONDS) * 1000;
            const timeoutMs = Number(process.env.WAIT_TIMEOUT_MINUTES) * 60 * 1000;
            const graceMs = Number(process.env.WAIT_GRACE_MINUTES) * 60 * 1000;
            const maxApiFailures = Number(process.env.WAIT_MAX_API_FAILURES);
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const startedAt = Date.now();
            let apiFailures = 0;

            core.info(`[wait] 目标: ${workflow} @ head_sha=${headSha}`);
            while (true) {
              const waited = Date.now() - startedAt;
              const waitedMin = Math.round(waited / 60000);

              // 超时判定放在循环开头：下面查询失败时会 continue，放在尾部会被跳过
              if (waited > timeoutMs) {
                core.setFailed(
                  `[wait] 超时：等 ${workflow} 超过 ${process.env.WAIT_TIMEOUT_MINUTES} 分钟仍无结论。` +
                  '这个上限已高于 build 自己的 job 超时，所以「编译慢」不会走到这里：' +
                  '大概率那个 run 长期卡在 queued（没有空闲编译 runner）。'
                );
                return;
              }

              let runs;
              try {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow,
                  head_sha: headSha,
                  per_page: 20,
                });
                runs = data.workflow_runs;
                apiFailures = 0;
              } catch (error) {
                // 不能让单次网络抖动掀掉整个 job：那意味着已经等掉的几小时编译白费，
                // 且 PR 门禁会以一个与被测代码无关的原因变红。
                apiFailures += 1;
                if (apiFailures >= maxApiFailures) {
                  core.setFailed(
                    `[wait] 连续 ${apiFailures} 次查询 ${workflow} 的 run 失败，放弃等待：` +
                    `${error.status || ''} ${error.message}\n` +
                    'runner 到 api.github.com 的网络（出网代理）大概率有问题，不是编译本身失败。'
                  );
                  return;
                }
                core.warning(
                  `[wait] 查询 run 失败（连续第 ${apiFailures}/${maxApiFailures} 次），` +
                  `${process.env.WAIT_POLL_SECONDS}s 后重试: ${error.status || ''} ${error.message}`
                );
                await sleep(pollMs);
                continue;
              }

              // 同一个 sha 上可能既有 pull_request 触发的 run、又有手动触发 / 重跑的，
              // 只要有一次成功就能拿到可用的 whl
              const ok = runs.find((r) => r.status === 'completed' && r.conclusion === 'success');
              if (ok) {
                core.info(`[wait] 编译已成功（等待 ${waitedMin} 分钟）: ${ok.html_url}`);
                core.setOutput('run-id', String(ok.id));
                core.setOutput('run-url', ok.html_url);
                return;
              }

              const pending = runs.find((r) => r.status !== 'completed');
              if (pending) {
                core.info(`[wait] 编译中 (${pending.status})，已等 ${waitedMin} 分钟: ${pending.html_url}`);
              } else if (runs.length > 0) {
                // 全部 completed 且无一成功：再等下去也不会有 whl，直接失败
                core.setFailed(
                  `[wait] ${workflow} 未成功（conclusion=${runs[0].conclusion}）: ${runs[0].html_url}\n` +
                  '没有可用的 whl。先修好编译，再重跑本 workflow。'
                );
                return;
              } else if (waited > graceMs) {
                core.setFailed(
                  `[wait] 等了 ${waitedMin} 分钟仍找不到 ${workflow} 在 ${headSha} 上的 run。\n` +
                  '本 workflow 是手动触发的，只用所选 ref 上编出来的 whl：请先在同一个 ref 上跑一次 ' +
                  'ppu_linux_build.yml（Actions → ppu-linux-build → Run workflow），再重跑本 workflow。'
                );
                return;
              } else {
                core.info(`[wait] 还没查到 build run，宽限期内继续等（已等 ${waitedMin} 分钟）`);
              }

              await sleep(pollMs);
            }

  # ---------------------------------------------------------------------------
  # 全量 UT 分片：8 个独立 job，每个一个单卡 PPU pod。
  #   - config: "default" 5 个分片（对齐 periodic.yml），pod 超时 480 分钟：单分片约摊到
  #     全量 UT 的 1/5，PPU 上比官方 g6.4xlarge 慢，且 install_wheel / install_test_deps
  #     每个 pod 都要各做一次。
  #   - config: "slow" 3 个分片（对齐 slow.yml），pod 超时给 300：这一档靠
  #     PYTORCH_TEST_SKIP_FAST=1 只跑 @slowTest 标记的用例，用例数远少于 default
  #     （虽然单个更慢）。
  #
  # 为什么是 8 个独立 job 而不是一个 8 条目的 matrix job（改回 matrix 会立刻踩坑）：
  #   flytiger-eco/ppu-distributed-action 把「同一个 job 里跑两个分片」当成不会发生的事，
  #   它区分并发调用的唯一维度就是 github.job，而 matrix 的所有分片 github.job 相同
  #   （等于 matrix job 的 key，matrix 取值不参与）：
  #     - NAS 暂存路径写死成
  #       /wl_nas/devops/<run_id>-<attempt>/${GITHUB_JOB}/{stage,source.tar.gz}。8 个分片
  #       并发 `cp -a $GITHUB_WORKSPACE/. stage/`、并发 `tar czf` 同一个 tarball，且任一
  #       分片打完包就 `rm -rf stage/`（把别人正在 cp 的目录删掉）。最先炸的是 .git 里
  #       mode 0444 的 pack 文件（源码树里唯一的只读文件）—— 第二个分片覆盖时 cp 拿不到
  #       写权限，报错原文：
  #         cp: cannot create regular file
  #         '/wl_nas/devops/<run_id>-1/ppu-full-ut/stage/./.git/objects/pack/pack-*.pack':
  #         Permission denied
  #     - worker pod 名同样只由 <run_id>-<attempt>-<sanitize(github.job) 截 20 字符> 拼成，
  #       8 个分片算出同一个名字又用 kubectl apply 提交 —— 互相覆盖，日志与成败判定全乱。
  #     - 它的 cleanup（默认 always）会删掉那个共享 tarball，牵连还在跑的其它分片。
  #   action 也没有任何入参可以区分同一个 job 内的多次调用（没有 stage_id / job_suffix
  #   之类），所以唯一可靠的做法是：一个分片 = 一个 job key。若哪天 action 支持了分片
  #   隔离入参，下面 8 个 job 可以收回成一个 matrix job。
  #
  # 拆成独立 job 顺带保住了原来 `fail-fast: false` 的语义：分片之间互不牵连，一次就能拿到
  # 完整的失败清单（全量 UT 的价值所在），而不是一个分片先红就取消其余 7 个。
  #
  # 代价是下面 8 段 YAML 几乎逐字重复。GHA 不支持 YAML anchor，而抽成本仓库的 composite
  # action 在 ARC + container 下不可用（理由见 wait-build 里那段注释），只能物理重复。
  # 8 段之间**只允许**这几处不同，其余必须逐字一致：
  #   - job key：必须前 20 字符就唯一（submit.sh 会把 job 名截到 20 字符去拼 pod 名）
  #   - name: 里的 config 与分片标签（run 页面上区分 8 个分片就靠它）
  #   - timeout_minutes，以及 command 里的 UT_CONFIG / SHARD_NUMBER / NUM_TEST_SHARDS
  # ---------------------------------------------------------------------------
  ut-default-1:
    name: "ppu-full-ut default 1/5 (890P 单卡)"
    needs: wait-build
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    # = 本分片的 pod 超时上限(480) + checkout/下载 whl/pod 启动与打包余量(60)。
    # 等 build 的时间不算在本 job 里（已由 wait-build 承担），所以不需要再叠 390。
    # slow 档的 pod 超时更短(300)，但 job 上限统一给 540，方便 8 段保持一致。
    # 注：6 小时 job 上限只约束 GitHub 托管 runner，本 job 在自建 ARC runner 上不受该限制。
    timeout-minutes: 540

    steps:
      # -----------------------------------------------------------------------
      # checkout 写成三次尝试，与下面「下载 whl artifact」同一个套路、同一个理由：自建
      # runner 出网走代理，git clone 与 artifact 下载撞的是同一类网络故障（tunneling
      # socket could not be established / getaddrinfo ENOTFOUND <proxy>，以及 fetch 中途
      # "RPC failed; curl transfer closed"）。本文件尤其不能容忍这种抖动：8 个分片已经
      # 等掉了几小时编译，一个分片在 clone 上挂了就要重跑一轮八小时级的全量 UT。
      # GHA 的 step 没有 retry 键（只有 continue-on-error / timeout-minutes），想重试一个
      # uses 步骤就只能再写一个 step，upstream 的 .github/actions/checkout-pytorch/action.yml
      # 也是这么干的（那个 action 在 ARC + container 下用不了，见 wait-build 那段注释）。
      # 不需要手动清场（与 whl 不同）：checkout 发现目录里的 .git 无效或 remote 对不上时会
      # 自己清空目录重新 clone，半个 .git 也能被下一次 fetch 续上。
      # 三段的 with: 必须逐字一致，否则重试会签出与第一次不同的东西。
      # 这五步在本文件 8 个分片里逐字相同（除本分片多了这段注释），也与 ppu_smoke.yml /
      # ppu_accuracy.yml / ppu_perf.yml / ppu_distribute.yml 里的对应五步等价，只差 ref：
      # 那四条是 PR 触发、取 pull_request.head.sha，本文件是手动触发、取 github.sha。
      # -----------------------------------------------------------------------
      - name: Checkout PyTorch
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          # 显式钉在 github.sha（= 手动触发时所选 ref 的 tip）：必须与 wait-build 里用来关联
          # build run 的那个 sha 一致，否则测的源码与装上的 whl 不是同一个 commit
          ref: ${{ github.sha }}
          # 只跑 python 测试，不需要 third_party 子模块；浅克隆加速，也减小传到 NAS 的包体积
          fetch-depth: 1

      - name: 重试前等待 (checkout 1)
        if: steps.checkout.outcome == 'failure'
        # 等代理 / DNS 缓过来再试，立即重试大概率撞上同一个故障窗口
        run: sleep 15

      - name: Checkout PyTorch (重试 1)
        id: checkout-retry-1
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: 重试前等待 (checkout 2)
        if: steps.checkout.outcome == 'failure' && steps.checkout-retry-1.outcome == 'failure'
        run: sleep 15

      # 最后一次：不加 continue-on-error，真的连不通就该失败
      - name: Checkout PyTorch (重试 2)
        if: steps.checkout.outcome == 'failure' && steps.checkout-retry-1.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      # -----------------------------------------------------------------------
      # 下载分三次写：download-artifact 没有 retries 输入（github-script 的 retries 只作用于
      # wait-build 那一步），而这一步要跨 run 拉一个几百 MB 的 zip，自建 runner 出网走代理，偶发
      #   Unable to download artifact(s): ... tunneling socket could not be established,
      #   cause=getaddrinfo ENOTFOUND <proxy>
      # 也就是代理域名一时解析不出来。走到这一步时已经等掉了几小时编译，为一次 DNS 抖动把
      # 门禁判红、要人手动重跑是不可接受的（与 wait-build 里 apiFailures 容忍连续失败同一个
      # 理由），所以前两次 continue-on-error、用 outcome 串成「失败才重试」，最后一次不兜着——
      # 真的连不通就该失败。
      #
      # 以下四步（下载 ×3 + 校验）与 ppu_smoke.yml / ppu_accuracy.yml / ppu_perf.yml 里的
      # 对应步骤等价，只是 run-id 取自 needs.wait-build 而不是本 job 内的 steps.wait-build。
      # -----------------------------------------------------------------------
      - name: 下载 whl artifact
        id: download-wheel
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          # artifact 名形如 ppu-wheel-<env>-<commit>（见 _ppu_build.yml 的 Collect wheel 步骤），
          # 这里按前缀取，不在两边各写一份命名规则
          pattern: ppu-wheel-*
          merge-multiple: true
          path: ${{ env.WHEEL_DIR_REL }}
          # 跨 run 下载必须显式给 run-id + token（默认只在当前 run 内找）
          run-id: ${{ needs.wait-build.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: 重试前清场 (1)
        if: steps.download-wheel.outcome == 'failure'
        env:
          WHEEL_DIR: ${{ env.WHEEL_DIR_REL }}
        run: |
          # v4 是边下边解压的，中途断掉可能留下一个截断的 whl；不清掉的话重试后
          # 「校验 whl」可能数到一个坏包，等到 pod 里 pip install 才炸（那时已占着 PPU 卡）。
          rm -rf "${WHEEL_DIR}"
          # 等代理 / DNS 缓过来再试，立刻重试大概率撞上同一个故障窗口
          sleep 30

      - name: 下载 whl artifact (重试 1)
        id: download-wheel-retry-1
        if: steps.download-wheel.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ppu-wheel-*
          merge-multiple: true
          path: ${{ env.WHEEL_DIR_REL }}
          run-id: ${{ needs.wait-build.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: 重试前清场 (2)
        if: steps.download-wheel.outcome == 'failure' && steps.download-wheel-retry-1.outcome == 'failure'
        env:
          WHEEL_DIR: ${{ env.WHEEL_DIR_REL }}
        run: |
          rm -rf "${WHEEL_DIR}"
          sleep 60

      # 最后一次：不加 continue-on-error，失败就让 job 红，报错原文即上面那条 ENOTFOUND
      - name: 下载 whl artifact (重试 2)
        if: steps.download-wheel.outcome == 'failure' && steps.download-wheel-retry-1.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          pattern: ppu-wheel-*
          merge-multiple: true
          path: ${{ env.WHEEL_DIR_REL }}
          run-id: ${{ needs.wait-build.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: 校验 whl 已就位
        env:
          # 用相对路径：${{ github.workspace }} 求值出的是 runner 自己的路径
          # (/home/runner/_work/...)，而本步骤跑在 container 里看到的是挂载点 (/__w/...)
          WHEEL_DIR: ${{ env.WHEEL_DIR_REL }}
          BUILD_RUN_URL: ${{ needs.wait-build.outputs.run-url }}
          UT_CONFIG: default
          SHARD_LABEL: "1/5"
        run: |
          # 卡在这里，而不是等 pod 起来才发现没包 —— 那时已经占着 PPU 卡了
          # 本步骤在 actions-runner 容器里跑，容器无 bash，默认 shell 会回退到 sh：
          # 不能用 shopt / 数组 / [[ ]] 等 bash 专有语法，一律改成 POSIX sh 写法。
          count=0
          wheel=""
          for f in "${WHEEL_DIR}"/torch-*.whl; do
            # glob 无匹配时 sh 会原样保留模式字符串，用 -e 过滤掉这个不存在的字面量（等价 nullglob）
            [ -e "$f" ] || continue
            count=$((count + 1))
            wheel="$f"
          done
          if [ "$count" -ne 1 ]; then
            echo "::error::期望 ${WHEEL_DIR} 下恰好 1 个 torch-*.whl，实际 ${count} 个"
            ls -la "${WHEEL_DIR}" 2>/dev/null || echo "（目录不存在）"
            exit 1
          fi
          wheel_name=$(basename "$wheel")
          echo "[wheel] ${wheel_name} ($(du -h "$wheel" | cut -f1))"
          {
            echo "### 被测 whl (${UT_CONFIG} ${SHARD_LABEL})"
            echo ""
            echo "- 包: \`${wheel_name}\`"
            echo "- 来源: ${BUILD_RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # 下一步 action 会 `cp -a $GITHUB_WORKSPACE/.` 到 NAS 再打包，先把 .git 删掉：
      #   - 体积：即使 fetch-depth: 1，.git 的 pack 仍占 workspace 的大头，而 staging 是
      #     写 NAS(NFS)，单次就要花几分钟 × 8 个分片。
      #   - 正确性：pod 内跑的 run_test.py、全部用例与 .ci/ppu/full_ut_test.sh 都不调 git，
      #     删掉不影响测试（只有 build 侧的 .ci/ppu/build_wheel.sh 要 rev-parse，不在本链路）。
      #   - 兼删了上面那类 cp "Permission denied" 的唯一触发源：.git 的 *.pack/*.idx/*.rev
      #     是源码树里唯一的只读(0444)文件。
      # 本步骤在 actions-runner 容器里跑（无 bash，回退 sh），只用 POSIX 写法。
      # -----------------------------------------------------------------------
      - name: 删掉 .git（减小 NAS 暂存体积）
        run: rm -rf .git

      - name: "890P 单卡 (1 PPU) CUDA 全量 UT"
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          nnodes: 0
          nproc_per_node: 1
          node_selector: ${{ env.NODE_SELECTOR }}
          host_volumes: ${{ env.HOST_VOLUMES }}
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          source_dir: ${{ env.SOURCE_DIR }}
          timeout_minutes: 480
          # 环境变量必须在 command 里注入：job 级 env 不会传进 PPU pod。
          # 脚本自身会 cd 到源码根目录，所以这里只给绝对路径即可。
          # WHEEL_DIR 指向上面下载的 whl（已随源码被 action 打包到 pod 的 source_dir 下）。
          # 不传 PR_NUMBER：手动触发没有 PR 号，full_ut_test.sh 里那行自检日志会打 pr=none。
          # 要溯源被测 commit 看「校验 whl」写进 summary 的包名与 build run 链接。
          command: |
            WHEEL_DIR="${{ env.SOURCE_DIR }}/${{ env.WHEEL_DIR_REL }}" \
            SDK_INSTALL_DIR="/usr/local" \
            PIP_INDEX="${{ env.PIP_INDEX }}" \
            TRITON_INDEX="${{ env.PIP_INDEX }}" \
            TRITON_VERSION="${{ env.TRITON_VERSION }}" \
            UT_CONFIG="default" \
            SHARD_NUMBER="1" \
            NUM_TEST_SHARDS="5" \
            bash ${{ env.SOURCE_DIR }}/.ci/ppu/full_ut_test.sh

  # 以下 7 个 job 与 ut-default-1 逐字相同，只改 job key / name / UT_CONFIG / SHARD_NUMBER /
  # NUM_TEST_SHARDS / timeout_minutes。步骤为什么这么写（三次下载、清场、校验、删 .git）
  # 全部见 ut-default-1 里的注释，改一处必须同步改这 8 段。
  ut-default-2:
    name: "ppu-full-ut default 2/5 (890P 单卡)"
    needs: wait-build
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 540

    steps:
      # 下面五步与 ut-default-1 里的对应五步逐字相同（理由见那里的注释）
      - name: Checkout PyTorch
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: 重试前等待 (checkout 1)
        if: steps.checkout.outcome == 'failure'
        run: sleep 15

      - name: Checkout PyTorch (重试 1)
        id: checkout-retry-1
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: 重试前等待 (checkout 2)
        if: steps.checkout.outcome == 'failure' && steps.checkout-retry-1.outcome == 'failure'
        run: sleep 15

      - name: Checkout PyTorch (重试 2)
        if: steps.checkout.outcome == 'failure' && steps.checkout-retry-1.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: 下载 whl artifact
        id: download-wheel
        continue-on-error: true
