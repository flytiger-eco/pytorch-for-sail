# P1 accuracy gate: PPU Inductor 精度测试，跑在自建 PPU 集群的单卡 pod 上。
#
# 执行模型（与 ppu_smoke.yml 一致）：
#   - job 只在 CPU runner 上做编排：checkout 源码后，由
#     flytiger-eco/ppu-distributed-action 把源码打包暂存到 NAS，在带 PPU 卡的节点上
#     拉起 pod，解压到 source_dir，再执行 command。
#   - 所以 runner 容器只需小体积的 actions-runner 镜像；PPU 发布镜像只在 PPU pod 内
#     使用，避免 CPU 节点拉大镜像超时。
#   - 精度用例只需单卡：nnodes: 0 + nproc_per_node: 1。
#   - pod 内实际逻辑见 .ci/ppu/accuracy_test.sh（含 include 白名单）。
#
# 被测的 torch 从哪来（与 ppu_smoke.yml 一致）：
#   - 等 ppu_linux_build.yml 把本 PR 的 whl 编完 → 下载它的 artifact → 随源码送进 pod →
#     在 pod 内 pip install 成功后才跑用例。inductor 精度用例对 torch 本体的改动极敏感，
#     用镜像里那份与 PR 无关的 torch 跑精度没有意义。
#   - 「等」是轮询 ppu-linux-build 在同一个 head sha 上的 run，而不是用 workflow_run：
#     workflow_run 只读默认分支上的 workflow 文件，且它的 run 不会作为 PR 的 check 出现，
#     当不了 PR 门禁。
#
# 设计取舍（重要）：
#   - inductor.yml 本身只是一个"薄编排层"：它调用 _linux-build.yml（先编 wheel）+ _linux-test.yml，
#     跑在 pytorch 官方云 GPU runner（linux.g5.4xlarge.nvidia.gpu 等）上，并且带
#     `if: github.repository_owner == 'pytorch'` 守卫。这套结构（先 build 再 test、云端 runner、
#     pytorch-only）与本仓库"跳过 build whl + 自建 PPU 集群 + 直接用镜像预装 torch"的诉求
#     本质互斥，无法照搬其 job/runner 定义。
#   - 因此这里只保留 inductor.yml 的**测试语义**：对齐其 inductor-test job 跑 CUDA inductor
#     精度单测（不做 inductor-cpu-test 对应的纯 CPU 一条线），执行机制完全沿用 ppu_smoke.yml。
#   - 测试范围：仅跑 inductor **正确性/精度单测**（python test/run_test.py --include inductor/...），
#     用 include 白名单精确过滤，天然排除掉非目标用例：
#       * 分布式/多卡：inductor/test_distributed_patterns、inductor/test_collective_autotuning
#       * 特殊后端：inductor/test_halide、inductor/test_pallas、inductor/test_triton_cpu_backend、
#         inductor/*_cpp_wrapper
#       * H100/B200(SM90/TMA/CUTLASS) 专属：inductor/test_max_autotune、inductor/test_cutedsl_grouped_mm、
#         inductor/test_cutlass_backend、inductor/test_flex_attention 的 TMA 用例
#         （真武 PPU 不适用，与 ppu_smoke.yml 的裁剪保持一致）
#       * FP8：inductor/test_fp8（真武 PPU 当前不支持 FP8，同步从 ppu_smoke.yml 里去掉了
#         test_scaled_matmul_cuda / inductor/test_fp8）
#   - 设备覆盖：只跑 CUDA 一条线（PPU 设备可见）。
#   - 触发方式：与 ppu_smoke.yml 一致，仅 pull_request（作为 PR 门禁），且 branches / paths 必须
#     与 ppu_linux_build.yml 完全对齐 —— 本 workflow 要等它的 whl，两边过滤不一致就会出现
#     「精度流水线触发了、但那个 PR 根本没编包」→ 永远等不到 whl。
#     不沿用 inductor.yml 的 push-to-main + repository_owner=='pytorch' 守卫（那是官方仓库专用）。
#     注意：pull_request 事件读取的是**默认分支**上的 workflow 文件，本文件需先合入默认分支才会对新 PR 生效。
name: ppu-accuracy

on:
  # 触发条件必须与 ppu_linux_build.yml 保持一致，改一侧就要同步改另一侧
  pull_request:
    branches:
      - v2.11.0
    paths:
      - 'aten/**'
      - 'torch/**'
      - 'c10/**'
      - 'torchgen/**'
      - 'setup.py'
      - '.ci/ppu/**'
      - '.github/workflows/ppu_linux_build.yml'
      - '.github/workflows/_ppu_build.yml'
      - '.github/workflows/ppu_accuracy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # 轮询 ppu-linux-build 的 run 状态、以及跨 run 下载它的 whl artifact 都需要
  actions: read

env:
  # PPU 基础镜像：python3.12 + CUDA13 + PPU SDK + triton，不含 torch —— torch 由
  # ppu-linux-build 的 whl 提供。刻意与 _ppu_build.yml 的 docker-image 默认值用同一个 tag：
  # 编译与运行同镜像，才不会出现 whl 与镜像里 SDK / 工具链对不上的问题。
  # 前置要求：该镜像须已预拉到 NODE_SELECTOR 指定板型的节点上，否则 pod 会卡在拉取阶段直至超时。
  IMAGE: pkg.flytiger-eco.com/docker_release/ppu:v2.1.1-cuda13.0-ubuntu24-py312
  NAMESPACE: ppu-sched
  HOST_VOLUMES: "/nas_aisw:/nas_aisw,/wl_nas:/mnt/wl_nas"
  # action 在 pod 内解压源码的路径（也是 action 的默认值，这里显式写出便于 command 引用）
  SOURCE_DIR: /workspace/source
  # 板型选 890P：集群里 890P 有 16 台（每台 8 PPU），810E 只有 1 台（16 PPU）。
  # 本 workflow 是每个 PR 都触发的长耗时门禁，钉在 810E 会与 ppu-smoke 互相排队在同一台机器上。
  NODE_SELECTOR: "board-type=ZW-M890P"
  # 内部 pip 源：pod 内只能访问内网，补装 run_test.py 必需的 pytest 插件要走这个源。
  # 仓库名是 pypi_index（带下划线的 VIRTUAL 仓，聚合 pypi_formal/aliyun/huawei/tsinghua 等代理）。
  # 写成 pypiindex 会命中不存在的仓库，Artifactory 对所有包返回 404，pip 报
  # "Could not find a version that satisfies the requirement ... (from versions: none)"。
  PIP_INDEX: https://pkg.flytiger-eco.com/artifactory/api/pypi/pypi_index/simple
  # 依赖的编译门禁：按 workflow 文件名找它在同一个 head sha 上的 run
  BUILD_WORKFLOW: ppu_linux_build.yml
  # whl 落地目录（相对源码根）。必须在源码树内，且不能被 .gitignore 命中：
  # 它要靠 ppu-distributed-action 打包源码一起送进 pod，而 dist/ 在 .gitignore 里，
  # 按 gitignore 过滤的打包方式会把它整个丢掉。
  WHEEL_DIR_REL: .ci/ppu/wheelhouse
  # 等 build 的上限：命中 ccache 的增量编译约几十分钟，冷编译要 4~5h。
  # 等待发生在自建 CPU runner 上（不占 PPU 卡），pod 要到真正跑用例那一步才拉起。
  WAIT_TIMEOUT_MINUTES: "300"
  WAIT_POLL_SECONDS: "60"
  # 「一个 build run 都还没出现」的宽限期：正常情况下两条 workflow 由同一事件同时创建，
  # 秒级就能查到。超过这个时间还查不到，基本就是两边触发条件不一致，早失败早暴露。
  WAIT_GRACE_MINUTES: "15"

jobs:
  # ---------------------------------------------------------------------------
  # CUDA/PPU 侧 inductor 精度单测（对齐 inductor.yml 的 inductor-test job）
  # ---------------------------------------------------------------------------
  ppu-accuracy-cuda:
    name: ppu-accuracy-cuda (890P 单卡)
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    # = 等 build 的上限(300) + 用例超时(120) + 下载/打包余量；命中缓存时实际远低于此
    timeout-minutes: 440

    steps:
      - name: Checkout PyTorch
        uses: actions/checkout@v4
        with:
          # 签出 PR head commit（github.sha 在 PR 场景是 merge commit），保证测试代码与 PR 一致
          ref: ${{ github.event.pull_request.head.sha }}
          # 只跑 python 测试，不需要 third_party 子模块；浅克隆加速，也减小传到 NAS 的包体积
          fetch-depth: 1

      # -----------------------------------------------------------------------
      # 等本 PR 的 whl 编好 → 下载到源码树内 → 校验。以下三步在 ppu_smoke.yml 与
      # ppu_accuracy.yml 里逐字相同，改一处必须同步改另一处（diff 两个文件即可确认没漂移）。
      #
      # 为什么不抽成 composite action：本 job 跑在 ARC(Actions Runner Controller) 自建
      # runner 上且带 container，ARC 的 k8s hook 把 workspace 拷进 job 容器，runner 进程
      # 自己看不到 checkout 的结果 —— `uses: ./.github/actions/xxx` 必然报
      # "Can't find 'action.yml' ... Did you forget to run actions/checkout"，即便
      # checkout 成功。改写成 owner/repo/.github/actions/xxx@ref 也不行：uses 不支持
      # 表达式，ref 只能写死，而改 action 的 PR 就没法自测自己那一版。
      # -----------------------------------------------------------------------
      - name: 等待 ppu-linux-build 编译完成
        id: wait-build
        # 只调 REST API，不占 PPU 卡；pod 要到真正跑用例那一步才拉起
        uses: actions/github-script@v7
        env:
          # head sha 必须用表达式经 env 传进来，不能在脚本里读
          # context.payload.pull_request：表达式由 runner 求值，而 context.payload 是
          # github-script 在容器内读 GITHUB_EVENT_PATH 指向的 event.json —— ARC 把
          # workspace 拷进容器后那个文件在容器里读不到，payload 会静默变成 {}，
          # 于是报 "TypeError: Cannot read properties of undefined (reading 'head')"。
          # （context.repo 不受影响：它读的是 GITHUB_REPOSITORY 环境变量。）
          # pull_request 事件下 github.sha 是 merge commit，而两条 workflow 的 run 都以
          # PR head commit 作为 head_sha，所以用它做关联键（也与上面 checkout 的 ref 一致）
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const workflow = process.env.BUILD_WORKFLOW;
            const headSha = process.env.HEAD_SHA;
            const pollMs = Number(process.env.WAIT_POLL_SECONDS) * 1000;
            const timeoutMs = Number(process.env.WAIT_TIMEOUT_MINUTES) * 60 * 1000;
            const graceMs = Number(process.env.WAIT_GRACE_MINUTES) * 60 * 1000;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const startedAt = Date.now();

            core.info(`[wait] 目标: ${workflow} @ head_sha=${headSha}`);
            while (true) {
              const waited = Date.now() - startedAt;
              const waitedMin = Math.round(waited / 60000);
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow,
                head_sha: headSha,
                per_page: 20,
              });
              const runs = data.workflow_runs;

              // 同一个 sha 上可能既有 pull_request 触发的 run、又有手动触发 / 重跑的，
              // 只要有一次成功就能拿到可用的 whl
              const ok = runs.find((r) => r.status === 'completed' && r.conclusion === 'success');
              if (ok) {
                core.info(`[wait] 编译已成功（等待 ${waitedMin} 分钟）: ${ok.html_url}`);
                core.setOutput('run-id', String(ok.id));
                core.setOutput('run-url', ok.html_url);
                return;
              }

              const pending = runs.find((r) => r.status !== 'completed');
              if (pending) {
                core.info(`[wait] 编译中 (${pending.status})，已等 ${waitedMin} 分钟: ${pending.html_url}`);
              } else if (runs.length > 0) {
                // 全部 completed 且无一成功：再等下去也不会有 whl，直接失败
                core.setFailed(
                  `[wait] ${workflow} 未成功（conclusion=${runs[0].conclusion}）: ${runs[0].html_url}\n` +
                  '没有可用的 whl。先修好编译，再重跑本 workflow。'
                );
                return;
              } else if (waited > graceMs) {
                core.setFailed(
                  `[wait] 等了 ${waitedMin} 分钟仍找不到 ${workflow} 在 ${headSha} 上的 run。\n` +
                  '最常见原因：本 workflow 与 ppu_linux_build.yml 的 branches / paths 过滤不一致，' +
                  '导致这个 PR 只触发了测试、没触发编译。'
                );
                return;
              } else {
                core.info(`[wait] 还没查到 build run，宽限期内继续等（已等 ${waitedMin} 分钟）`);
              }

              if (waited > timeoutMs) {
                core.setFailed(
                  `[wait] 超时：等 ${workflow} 超过 ${process.env.WAIT_TIMEOUT_MINUTES} 分钟。` +
                  '冷编译（ccache 未命中）本身就要 4~5h，可先在 base 分支跑一次 ppu_refresh_cache.yml 种缓存。'
                );
                return;
              }
              await sleep(pollMs);
            }

      - name: 下载 whl artifact
        uses: actions/download-artifact@v4
        with:
          # artifact 名形如 ppu-wheel-<env>-<commit>（见 _ppu_build.yml 的 Collect wheel 步骤），
          # 这里按前缀取，不在两边各写一份命名规则
          pattern: ppu-wheel-*
          merge-multiple: true
          path: ${{ env.WHEEL_DIR_REL }}
          # 跨 run 下载必须显式给 run-id + token（默认只在当前 run 内找）
          run-id: ${{ steps.wait-build.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: 校验 whl
        env:
          # 用相对路径：${{ github.workspace }} 求值出的是 runner 自己的路径
          # (/home/runner/_work/...)，而本步骤跑在 container 里看到的是挂载点 (/__w/...)
          WHEEL_DIR: ${{ env.WHEEL_DIR_REL }}
          BUILD_RUN_URL: ${{ steps.wait-build.outputs.run-url }}
        run: |
          # 卡在这里，而不是等 pod 起来才发现没包 —— 那时已经占着 PPU 卡了
          shopt -s nullglob
          whls=("${WHEEL_DIR}"/torch-*.whl)
          if [[ ${#whls[@]} -ne 1 ]]; then
            echo "::error::期望 ${WHEEL_DIR} 下恰好 1 个 torch-*.whl，实际 ${#whls[@]} 个"
            ls -la "${WHEEL_DIR}" 2>/dev/null || echo "（目录不存在）"
            exit 1
          fi
          wheel_name=$(basename "${whls[0]}")
          echo "[wheel] ${wheel_name} ($(du -h "${whls[0]}" | cut -f1))"
          {
            echo "### 被测 whl"
            echo ""
            echo "- 包: \`${wheel_name}\`"
            echo "- 来源: ${BUILD_RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "890P 单卡 (1 PPU) CUDA inductor 精度单测"
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          nnodes: 0
          nproc_per_node: 1
          node_selector: ${{ env.NODE_SELECTOR }}
          host_volumes: ${{ env.HOST_VOLUMES }}
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          source_dir: ${{ env.SOURCE_DIR }}
          timeout_minutes: 120
          # 环境变量必须在 command 里注入：job 级 env 不会传进 PPU pod。
          # 脚本自身会 cd 到源码根目录，所以这里只给绝对路径即可。
          # WHEEL_DIR 指向上面下载的 whl（已随源码被 action 打包到 pod 的 source_dir 下）。
          command: |
            PR_NUMBER="${{ github.event.pull_request.number }}" \
            WHEEL_DIR="${{ env.SOURCE_DIR }}/${{ env.WHEEL_DIR_REL }}" \
            SDK_INSTALL_DIR="/usr/local" \
            PIP_INDEX="${{ env.PIP_INDEX }}" \
            bash ${{ env.SOURCE_DIR }}/.ci/ppu/accuracy_test.sh
            

