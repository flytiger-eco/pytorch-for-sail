name: Release Docker Images Nightly (PPU)

# Use the repository root as the build context and publish to GHCR with GITHUB_TOKEN.
on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push images to GHCR; disable for a build-only dry run'
        required: false
        type: boolean
        default: true
  schedule:
    # Every day at 00:00 Beijing Time (UTC+8).
    - cron: '0 16 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  build:
    # Reuse the 8-core / 32GB PPU build runner to accommodate source compilation.
    runs-on: x86-ubuntu2404-8-32
    timeout-minutes: 350
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: meta
        run: |
          set -euo pipefail
          owner_lc=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          date_tag=$(date -u +%Y%m%d)
          short_sha="${GITHUB_SHA::7}"
          # Sanitize the branch name and truncate it to keep Docker tags within 128 bytes.
          branch=$(printf '%s' "$GITHUB_REF_NAME" | LC_ALL=C tr -c 'A-Za-z0-9._-' '-')
          branch="${branch:0:90}"
          echo "image=ghcr.io/${owner_lc}/pytorch-ppu-nightly" >> "$GITHUB_OUTPUT"
          echo "tag=${branch}-${date_tag}-cuda13.0.0-sdk2.2.0-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "rolling=nightly" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Packages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ppu/Dockerfile.sdk2.2-ppu
          target: runtime
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.rolling }}
          # Override the Dockerfile default of 32 jobs to match the runner resources.
          build-args: |
            MAX_JOBS=8
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Write build summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          ROLLING: ${{ steps.meta.outputs.rolling }}
          PUSH_IMAGE: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        run: |
          if [[ "$PUSH_IMAGE" == "true" ]]; then
            printf 'Published PPU image: `%s:%s` (rolling tag: `%s:%s`)\n' \
              "$IMAGE" "$TAG" "$IMAGE" "$ROLLING" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'PPU image built successfully without pushing: `%s:%s`\n' \
              "$IMAGE" "$TAG" >> "$GITHUB_STEP_SUMMARY"
          fi
